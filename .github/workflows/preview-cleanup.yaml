name: Preview cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-cleanup
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout the trusted cleanup helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Remove this PR's preview deployments
        run: node scripts/pages-preview.ts cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
